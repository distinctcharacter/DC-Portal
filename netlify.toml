[build]
  command = "npm run build"
  publish = ".next"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["protected-resources/resources/*.pdf"]

[[redirects]]
  from = "/resources/:file"
  to = "/.netlify/functions/protected-resource?file=:file"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self)"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob: https:; font-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://clerk.distinctcharacter.com https://*.clerk.com; style-src 'self' 'unsafe-inline' https://clerk.distinctcharacter.com https://*.clerk.com; connect-src 'self' https://clerk.distinctcharacter.com https://api.clerk.com https://*.clerk.com https://api.stripe.com; frame-src https://clerk.distinctcharacter.com https://*.clerk.com; form-action 'self' https://clerk.distinctcharacter.com https://*.stripe.com https://*.clerk.com; upgrade-insecure-requests"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"

[[plugins]]
  package = "@netlify/plugin-nextjs"

